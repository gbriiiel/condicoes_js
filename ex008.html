<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    velocidade do carro: <input type="number" name="txtvel" id="txtvel">
    <input type="button" value="verificar" onclick="verificar()">
    <div id="res">

    </div>
    <script>
        var txtvel= window.document.getElementById('txtvel')
        function verificar(){
            var txtvel= window.document.getElementById('txtvel')
            var res= window.document.querySelector('div#res')
            var vel= Number(txtvel.value)
            res.innerHTML= `<p>Sua velocidade eh <strong>${vel} km/h</strong></p>`
            if(vel > 60){
                res.innerHTML+= `<p>Voce ultrapassou a velocidade permitida. <strong>MULTADO!</strong></p>`
            }else{
                res.innerHTML+= `<p>Voce esta dentro da velocidade permitida.</p>`
                res.innerHTML+= `<p>Dirija sempre usando cinto de segurança!</p>`
            }
        }
    </script>
</body>
</html>
